# Phantom Thieves UI sounds
volume = 0.6
rate_limit_ms = 90
workspace = true
notify = true
lock = true
unlock = true
focus = false
player = pw-play
menu_open = true
menu_close = true
# Window open/close are deliberately separate from the menu sounds: opening an
# app is a heavier event than opening a menu, and reusing menu-open/close made
# every window feel like a menu popup.
window_open = true
window_close = true
