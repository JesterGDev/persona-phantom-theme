[font]
# Replaces the whole [font] section, so base-size is redeclared here.
#
# Persona 5 sets its interface in large, hard-edged display type and keeps
# body copy small by comparison. Barlow Condensed runs narrower than the
# stock face, so base-size is raised and bar tokens pinned on top - the bar
# strip grows a couple of pixels with it, which is how P5's chunky bars look
# anyway.
base-size = 14
body          = 18
caption       = 15
subtitle      = 16
title         = 18
heading       = 22
display       = 30
display-large = 36
